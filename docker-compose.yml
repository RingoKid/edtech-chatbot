# docker-compose.yml
services:
  backend:
    build:
      context: .
      target: final 
    ports:
      - "8000:8000"
      - "2024:2024"  # LangGraph Studio port
    volumes:
      - ./backend:/app
    # Start both FastAPI and LangGraph Studio
    command: sh -c "langgraph dev --host 0.0.0.0 --port 2024 & uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - ./backend/.env
      - ./backend/.env.local
    environment:
      - ENV=development
      - PYTHONPATH=/app

  frontend:
    image: node:22-alpine
    working_dir: /app/frontend
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app/frontend
      - node_modules:/app/frontend/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    ports:
      - "8001:8000"
    volumes:
      - dynamodb_data:/home/dynamodblocal/data
    working_dir: /home/dynamodblocal
    user: root
    command: ["-jar", "DynamoDBLocal.jar", "-dbPath", "./data", "-sharedDb"]

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/workflows
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/

volumes:
  node_modules:
  dynamodb_data:
  n8n_data: