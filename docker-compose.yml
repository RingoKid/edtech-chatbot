# docker-compose.yml
services:
  backend:
    build:
      context: .
      # Target the final stage, but we will override the CMD and mount source code.
      # This ensures dev dependencies are aligned if you add a dev stage later.
      target: final 
    ports:
      - "8000:8000"
    volumes:
      # Mount your local backend source code into the container.
      # Changes on your host will be reflected immediately inside the container.
      - ./backend:/app
    # Override the production CMD to run Uvicorn with --reload for hot-reloading.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      # Define development-specific environment variables here.
      - ENV=development
      - PYTHONPATH=/app

  frontend:
    # Use the base node image directly for the React development server.
    image: node:22-alpine
    working_dir: /app/frontend
    ports:
      - "3000:3000" # Assuming React dev server runs on 3000
    volumes:
      # Mount the frontend source code.
      - ./frontend:/app/frontend
      # Use a named volume for node_modules to prevent host OS from overwriting it.
      # This isolates dependencies inside the container for performance and consistency.
      - node_modules:/app/frontend/node_modules
    # Command to install dependencies (if not already present) and start the dev server.
    command: sh -c "npm install && npm start"

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    ports:
      - "8001:8000"
    volumes:
      # Change this from a named volume to a bind mount
      - ./data/dynamodb:/home/dynamodblocal/data
    working_dir: /home/dynamodblocal
    command: [ "-jar", "DynamoDBLocal.jar", "-sharedDb", "-optimizeDbBeforeStartup", "-dbPath", "./data" ]

volumes:
  # Define the named volume used by the frontend service.
  node_modules:
  # Define the named volume for DynamoDB data persistence
  dynamodb_data: