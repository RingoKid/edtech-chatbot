# docker-compose.yml
services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      # Mount your local backend source code into the container.
      # Changes on your host will be reflected immediately inside the container.
      - ./backend:/app
    # Override the production CMD to run Uvicorn with --reload for hot-reloading.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      # Define development-specific environment variables here.
      - ENV=development
      - PYTHONPATH=/app

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80" # Map host port 3000 to container port 80 (nginx)

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    ports:
      - "8001:8000"
    volumes:
      # Change this from a named volume to a bind mount
      - ./data/dynamodb:/home/dynamodblocal/data
    working_dir: /home/dynamodblocal
    command: [ "-jar", "DynamoDBLocal.jar", "-sharedDb", "-optimizeDbBeforeStartup", "-dbPath", "./data" ]

volumes:
  # Define the named volume for DynamoDB data persistence
  dynamodb_data: