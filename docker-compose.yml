# docker-compose.yml
services:
  backend:
    build:
      context: .
      target: final 
    ports:
      - "8000:8000"
      - "2024:2024"  # LangGraph Studio port
    volumes:
      - ./backend:/app
    # Start both FastAPI and LangGraph Studio
    command: sh -c "langgraph dev --host 0.0.0.0 --port 2024 & uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - ./backend/.env
      - ./backend/.env.local
    environment:
      - ENV=development
      - PYTHONPATH=/app

  frontend:
    image: node:22-alpine
    working_dir: /app/frontend
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app/frontend
      - node_modules:/app/frontend/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    ports:
      - "8001:8000"
    volumes:
      - ./data/dynamodb:/home/dynamodblocal/data
    working_dir: /home/dynamodblocal
    command: [ "-jar", "DynamoDBLocal.jar", "-sharedDb", "-optimizeDbBeforeStartup", "-dbPath", "./data" ]

volumes:
  node_modules:
  dynamodb_data: