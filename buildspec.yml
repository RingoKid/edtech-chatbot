version: 0.2

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      # Use AWS-provided environment variables for region and account ID
      # to make the script portable and secure.
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
      # Set up variables for the repository URI and a unique image tag
      - REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/edtech-chatbot
      # Use the first 7 characters of the Git commit hash as the image tag
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)

  build:
    commands:
      # --- Test Execution ---
      # It's better to run tests inside a container built from your Dockerfile
      # to ensure the test environment is identical to production.
      # For now, we will skip running tests directly in CodeBuild to simplify.
      # We can add a dedicated testing stage later.

      # --- Docker Build ---
      - echo "Build started on $(date)"
      - echo "Building the Docker image..."
      - docker build -t $REPOSITORY_URI:latest .
      # Tag the image with the specific commit hash for versioning
      - docker tag $REPOSITORY_URI:latest $REPOSITORY_URI:$IMAGE_TAG

  post_build:
    commands:
      - echo "Build completed on $(date)"
      - echo "Pushing the Docker images to ECR..."
      # Push both the 'latest' and the commit-specific tag
      - docker push $REPOSITORY_URI:latest
      - docker push $REPOSITORY_URI:$IMAGE_TAG