# docker-compose.override.yml
# Local development overrides - automatically applied when running docker-compose
services:
  dynamodb-local:
    # Persist data across restarts using a named volume
    user: root
    volumes:
      - dynamodb_data:/home/dynamodblocal/data
    command: ["-jar", "DynamoDBLocal.jar", "-dbPath", "./data", "-sharedDb"]
