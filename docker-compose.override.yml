# docker-compose.override.yml
services:
  backend:
    ports:
      # Expose the debugger port 5678 to your local machine
      - "5678:5678"

    env_file:
      - ./backend/.env
      - ./backend/.env.local

    # Override the start command to launch both LangGraph Studio and FastAPI via the debugger
    # Changed to use a simpler command that works better with IntelliJ dev containers
    command: >
      sh -c "sleep infinity"
