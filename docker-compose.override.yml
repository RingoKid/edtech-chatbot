# docker-compose.override.yml
services:
  backend:
    ports:
      # Expose the debugger port 5678 to your local machine
      - "5678:5678"

    environment:
      # Enable debug mode to start FastAPI with debugger
      - DEBUG_MODE=true

    # Use the startup script which now supports debug mode
    command: >
      sh -c "chmod +x ./startup.sh && ./startup.sh"

